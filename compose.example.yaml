# compose.example.yaml — Crafty + ProtonVPN (Gluetun) + port-updater
#
# Copy to compose.yaml, fill in every value marked "# CHANGE", then:
#   docker compose up -d
#
# All three service containers share Gluetun's network namespace so they all
# use the ProtonVPN tunnel and the port-updater can reach Crafty on localhost.

services:

  # ---------------------------------------------------------------------------
  # Gluetun — ProtonVPN WireGuard tunnel with port-forwarding
  # ---------------------------------------------------------------------------
  gluetun-crafty:
    image: qmcgaw/gluetun:latest
    container_name: gluetun-crafty
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_TYPE=wireguard
      - VPN_SERVICE_PROVIDER=protonvpn
      - WIREGUARD_PRIVATE_KEY=PASTE_WIREGUARD_PRIVATE_KEY_HERE   # CHANGE
      - VPN_PORT_FORWARDING=on
      - PORT_FORWARD_ONLY=on
      - SERVER_COUNTRIES=Netherlands,Germany,France,United Kingdom
      - BLOCK_MALICIOUS=off
      - UPDATER_PERIOD=24h
      - TZ=Europe/London
      # DOT (DNS-over-TLS) and DNS_ADDRESS are omitted; gluetun defaults are fine.
      # Gluetun 3.40+ requires authentication for its control API.
      # The simplest option is to create /gluetun/auth/config.toml with auth="none"
      # for the routes port-updater needs (see README — Deploying on TrueNAS SCALE).
      # Alternatively set FIREWALL_INPUT_PORTS below and supply an API key to port-updater
      # via GLUETUN_API_KEY.
      # FIREWALL_VPN_INPUT_PORTS is intentionally omitted: gluetun does not support port
      # ranges here and automatically opens the actively-forwarded NAT-PMP port when
      # VPN_PORT_FORWARDING=on — no manual firewall rule is needed.
      # Allow inbound from LAN to the Crafty WebUI (8443) and Gluetun control API (8000).
      - FIREWALL_INPUT_PORTS=8443,8000
      # Subnets reachable WITHOUT going through the VPN tunnel (your LAN).
      # WARNING: Do NOT include 10.0.0.0/8 — it overlaps Proton's WireGuard gateway
      # (e.g. 10.2.0.1) and breaks NAT-PMP port forwarding.
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24
      # Write the forwarded port to a shared file watched by port-updater
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'echo {{PORT}} > /shared/forwarded_port'
    volumes:
      - /mnt/Apps/app-configs/gluetun-crafty:/gluetun
      - /mnt/Apps/app-configs/shared:/shared
    ports:
      - "30025:8443/tcp"   # Crafty HTTPS web UI (LAN access)
      - "30026:8000/tcp"   # Crafty HTTP / Gluetun control API (optional)
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Crafty Controller — Minecraft server manager
  # ---------------------------------------------------------------------------
  crafty:
    image: registry.gitlab.com/crafty-controller/crafty-4:latest
    container_name: crafty
    depends_on:
      - gluetun-crafty
    network_mode: "service:gluetun-crafty"
    environment:
      - TZ=Europe/London
    volumes:
      - /mnt/Apps/app-configs/crafty/backups:/crafty/backups
      - /mnt/Apps/app-configs/crafty/logs:/crafty/logs
      - /mnt/Apps/app-configs/crafty/servers:/crafty/servers
      - /mnt/Apps/app-configs/crafty/config:/crafty/app/config
      - /mnt/Apps/app-configs/crafty/import:/crafty/import
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # port-updater — watches forwarded_port, updates DNS + server + Crafty
  # ---------------------------------------------------------------------------
  port-updater:
    image: ghcr.io/alpasyon007/crafty-proton-port-updater:latest
    container_name: crafty-port-updater
    depends_on:
      - crafty
    network_mode: "service:gluetun-crafty"
    environment:
      # --- file written by Gluetun
      - PORT_FILE=/shared/forwarded_port

      # --- Crafty REST API (self-signed cert is accepted automatically)
      # Note: CRAFTY_URL defaults to https://127.0.0.1:8443. For this to work,
      # Crafty must bind 0.0.0.0; edit https_bind in /crafty/app/config/config.json:
      #   "https_bind": "0.0.0.0"
      - CRAFTY_URL=https://127.0.0.1:8443
      - CRAFTY_TOKEN=PASTE_CRAFTY_API_TOKEN_HERE                          # CHANGE

      # --- server UUIDs and matching server.properties paths (comma-separated)
      - SERVER_IDS=PASTE_SERVER_UUID_HERE                                  # CHANGE
      - SERVER_PROPS_PATHS=/crafty/servers/PASTE_SERVER_UUID_HERE/server.properties  # CHANGE

      # --- Cloudflare DNS (leave empty to disable)
      - CF_TOKEN=PASTE_CLOUDFLARE_API_TOKEN_HERE                          # CHANGE (or leave blank)
      - CF_ZONE_ID=PASTE_CLOUDFLARE_ZONE_ID_HERE                          # CHANGE (or leave blank)
      - CF_SRV_NAME=_minecraft._tcp.play.example.com                      # CHANGE to your domain
      - CF_A_NAME=play.example.com                                        # CHANGE (or leave blank)
      - CF_TARGET=play.example.com                                        # CHANGE to your domain
      - CF_TTL=60

      # --- Gluetun control API (optional — needed only if auth is enabled)
      # Leave empty to skip authentication (requires auth="none" in config.toml).
      # Set to your API key if you use apikey auth in /gluetun/auth/config.toml.
      # - GLUETUN_API_KEY=your_api_key_here

      # --- polling interval
      - POLL_SECONDS=5
    volumes:
      - /mnt/Apps/app-configs/shared:/shared
      - /mnt/Apps/app-configs/crafty/servers:/crafty/servers
    restart: unless-stopped
